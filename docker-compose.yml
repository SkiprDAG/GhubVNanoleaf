version: '3.8'

services:
  ghub-nanoleaf-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghub-v-nanoleaf-server
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "60222:60222/udp"
      - "5353:5353/udp"
    environment:
      - NANOLEAF_IP=${NANOLEAF_IP:-192.168.1.100}
      - NANOLEAF_TOKEN=${NANOLEAF_TOKEN:-}
      - NANOLEAF_PORT=${NANOLEAF_PORT:-16021}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
