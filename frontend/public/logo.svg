<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d500ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#ff4b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" stroke="#252a40" stroke-width="4"/>

  <!-- Glowing Nanoleaf Polygons -->
  <g filter="url(#glow)">
    <!-- Top Center Triangle -->
    <polygon points="256,90 350,250 162,250" fill="url(#leafGrad1)" opacity="0.95"/>
    <!-- Bottom Left Triangle -->
    <polygon points="162,265 256,425 68,425" fill="url(#leafGrad2)" opacity="0.95"/>
    <!-- Bottom Right Triangle -->
    <polygon points="350,265 444,425 256,425" fill="url(#leafGrad3)" opacity="0.95"/>
  </g>
</svg>
