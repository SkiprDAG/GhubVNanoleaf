[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghub-v-nanoleaf"
version = "1.0.0"
description = "Real-time bridge connecting Logitech G HUB battery/device states and PC audio to Nanoleaf panels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "skipr" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "RUF001", # ambiguous unicode characters in string
    "RUF002", # ambiguous unicode characters in docstring (bilingual docs)
    "RUF003", # ambiguous unicode characters in comment (bilingual comments)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "control", "domain", "ghub", "lighting", "nanoleaf", "agent"]

[tool.pyright]
include = [
    "agent",
    "config",
    "control",
    "domain",
    "ghub",
    "lighting",
    "nanoleaf",
    "tests",
    "main.py",
    "logging_config.py",
    "run_agent.py",
    "run_server.py",
]
venvPath = "."
venv = "venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["venv", "frontend"]

